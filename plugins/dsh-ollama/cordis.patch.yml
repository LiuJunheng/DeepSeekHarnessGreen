# dsh-ollama bundle patch: 把本插件作为一行插入 profile 插件树。
# 格式与同项目插件 dsh-sidebar-lite / dsh-usage-stats 完全一致:
#   - insert: 新增一行插件行 (id 是本插件行标识, name 是包名)。
# config 为本插件的入口配置, 覆盖 DEFAULT_CONFIG (见 lib/index.js):
#   enabled              是否启用自动识别 (默认 true)
#   baseUrl              Ollama 服务根地址, 不含 /v1 (默认 http://localhost:11434)
#   displayName          Models 页显示的提供方名称 (默认 Ollama)
#   defaultContextWindow 模型发现不到上下文大小时的默认值 (默认 32768)
#   defaultMaxTokens     模型发现不到最大输出时的默认值 (默认 8192)
#   authorizationHeader  发送给 Ollama 的 Authorization 头 (pi-ai 要求必须有
#                         apiKey 或 authorization 头才放行 openai-completions
#                         请求; Ollama 不校验该头。留空则不发。默认 Bearer ollama-local)
#   detectIntervalMs     周期性探测间隔毫秒 (默认 60000)
#   probeTimeoutMs       单次探测超时毫秒 (默认 3000)
#   ensureContext        是否自动修复 Ollama 上下文容量 (默认 true; 坑 35):
#                         探测到容量不足的模型时, 自动用 Modelfile 固化 num_ctx
#                         并创建 "<原名>-32k" 变体, models 自动指向变体 —— 否则
#                         DSH 工具 schema 被截断、模型从不调用工具 + 报 token 上限
#   targetContextWindow  变体固化的目标上下文窗口 (默认 32768)
#   targetMaxTokens      模型单次输出上限 (默认 8192; 必须远小于 contextWindow,
#                         相等时输入空间为零必截断)
- insert:
    - id: ollama
      name: dsh-ollama
      config:
        enabled: true
        baseUrl: http://localhost:11434
        displayName: Ollama
        defaultContextWindow: 32768
        defaultMaxTokens: 8192
        authorizationHeader: Bearer ollama-local
        detectIntervalMs: 60000
        probeTimeoutMs: 3000
        ensureContext: true
        targetContextWindow: 32768
        targetMaxTokens: 8192
