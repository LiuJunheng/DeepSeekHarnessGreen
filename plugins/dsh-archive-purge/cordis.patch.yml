# dsh-archive-purge bundle patch: 把本插件作为一行插入 profile 插件树。
# 格式与官方 bundle (如 @deepseek-ai/dsh-base) 完全一致:
#   - insert: 新增一行插件行 (id 是本插件行标识, name 是包名)。
# 该文件路径在 package.json 的 dsh.bundle.patch 中声明,
# dsh plugin 命令 reconcile 时会据此把 dsh-archive-purge 加入
# profile 的 dsh.profile.bundles 层列表, 服务启动时才真正被加载。
- insert:
    - id: archive-purge
      name: dsh-archive-purge
