<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="256x256" href="./assets/apple-touch-icon.png">
  <!-- Social sharing -->
  <meta property="og:image" content="https://dsh-green.website/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://dsh-green.website/assets/og-image.png">
  <meta name="google-adsense-account" content="ca-pub-4210397233262199" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4210397233262199" crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Changelog · Choose Language</title>
  <link rel="canonical" href="https://dsh-green.website/changelog.html">
  <link rel="alternate" hreflang="zh-Hans" href="https://dsh-green.website/zh/changelog.html">
  <link rel="alternate" hreflang="zh-Hant" href="https://dsh-green.website/zh-Hant/changelog.html">
  <link rel="alternate" hreflang="en" href="https://dsh-green.website/en/changelog.html">
  <link rel="alternate" hreflang="x-default" href="https://dsh-green.website/en/changelog.html">
  <link rel="stylesheet" href="./assets/style.css?v=3.7">
  <script>
    (function() {
      var PREF_KEY = 'dshe-lang-preference';
      var saved = null;
      try { saved = localStorage.getItem(PREF_KEY); } catch (e) {}
      var NORMALIZE = { 'zh-Hans': 'zh', 'zh-TW': 'zh-Hant', 'zh-HK': 'zh-Hant', 'zh-MO': 'zh-Hant', 'zh-Hant': 'zh-Hant' };
      var target = null;
      if (saved) {
        var norm = NORMALIZE[saved] || saved;
        if (norm === 'zh' || norm === 'zh-Hant' || norm === 'en') target = './' + norm + '/changelog.html';
      }
      if (!target) {
        var langs = navigator.languages ? navigator.languages.slice() : [navigator.language || 'en'];
        var nl = langs.map(function(l) { return l.toLowerCase(); });
        if (nl.some(function(l) { return l === 'zh-tw' || l === 'zh-hk' || l === 'zh-mo' || l.indexOf('zh-hant') === 0; })) target = './zh-Hant/changelog.html';
        else if (nl.some(function(l) { return l.indexOf('zh') === 0; })) target = './zh/changelog.html';
        else target = './en/changelog.html';
      }
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <main class="legal-page">
    <h1>Changelog · 选择语言</h1>
    <p>Redirecting… 浏览器将根据语言自动跳转，或手动点击下方链接：</p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;">
      <a href="./zh/changelog.html" class="btn btn-primary" onclick="try{localStorage.setItem('dshe-lang-preference','zh');}catch(e){}" style="min-width:140px;text-align:center;">简体中文</a>
      <a href="./zh-Hant/changelog.html" class="btn btn-primary" onclick="try{localStorage.setItem('dshe-lang-preference','zh-Hant');}catch(e){}" style="min-width:140px;text-align:center;">繁體中文</a>
      <a href="./en/changelog.html" class="btn btn-primary" onclick="try{localStorage.setItem('dshe-lang-preference','en');}catch(e){}" style="min-width:140px;text-align:center;">English</a>
    </div>
  </main>
</body>
</html>
